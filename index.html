<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyCharm & Python Adaptiv Test</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 30px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
        }

        .level-badge {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
        }

        .streak-board {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .question {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
            color: #f1f5f9;
        }

        .code-block {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px 16px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.95rem;
            color: #38bdf8;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            background-color: #334155;
            color: #f8fafc;
            border: 2px solid transparent;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            border-color: #38bdf8;
        }

        .option-btn.correct {
            background-color: #065f46 !important;
            border-color: #10b981 !important;
            color: #ecfdf5;
        }

        .option-btn.wrong {
            background-color: #991b1b !important;
            border-color: #ef4444 !important;
            color: #fef2f2;
        }

        .status-msg {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: none;
        }

        .status-msg.success { color: #34d399; }
        .status-msg.fail { color: #f87171; }

        .controls {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }

        .next-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="quiz-card">
        <div class="header">
            <span class="level-badge" id="levelBadge">Daraja: 1 (Boshlang'ich)</span>
            <span class="streak-board" id="streakBoard">Ketma-ket to'g'ri: 0</span>
        </div>

        <div class="question" id="questionText">Savol yuklanmoqda...</div>
        <div class="code-block" id="codeBlock" style="display: none;"></div>

        <div class="options-grid" id="optionsContainer"></div>

        <div class="status-msg" id="statusMsg"></div>

        <div class="controls">
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Keyingi savol ➔</button>
        </div>
    </div>

    <script>
        // Savollar darajalar bo'yicha ajratilgan (1 - Oson, 2 - O'rta, 3 - Qiyin)
        const questionsByLevel = {
            1: [
                {
                    q: "PyCharm'da kodni ishga tushirish (Run) uchun qaysi klaviatura tugmalari bosiladi?",
                    code: "",
                    options: ["Shift + F10", "Ctrl + F5", "Alt + F9", "Ctrl + Shift + R"],
                    correct: 0
                },
                {
                    q: "PyCharm'da joriy qatorni izohga (comment) olish tugmasi qaysi?",
                    code: "",
                    options: ["Ctrl + /", "Alt + /", "Ctrl + C", "Shift + Esc"],
                    correct: 0
                },
                {
                    q: "Ushbu Python kodi brauzer/terminalga nima chiqaradi?",
                    code: "x = [1, 2, 3]\nprint(x[1])",
                    options: ["1", "2", "3", "IndexError"],
                    correct: 1
                }
            ],
            2: [
                {
                    q: "PyCharm'da koddagi o'zgaruvchi nomini barcha joyda xavfsiz o'zgartirish (Refactor / Rename) komandasi qaysi?",
                    code: "",
                    options: ["Ctrl + R", "Shift + F6", "Alt + F6", "Ctrl + Alt + L"],
                    correct: 1
                },
                {
                    q: "PyCharm interfeysida Pep8 bo'yicha kodni formatlash (Reformat Code) uchun nima bosiladi?",
                    code: "",
                    options: ["Ctrl + Alt + L", "Ctrl + Shift + F", "Alt + Enter", "Shift + F10"],
                    correct: 0
                },
                {
                    q: "Ushbu kod bajarilgach 'result' qiymati nima bo'ladi?",
                    code: "nums = [1, 2, 3, 4, 5]\nresult = nums[1:4]",
                    options: ["[1, 2, 3]", "[2, 3, 4]", "[2, 3, 4, 5]", "[1, 2, 3, 4]"],
                    correct: 1
                }
            ],
            3: [
                {
                    q: "PyCharm Debugger rejimida kodni qatorma-qator va funksiya ichiga kirmasdan (Step Over) bajarish tugmasi qaysi?",
                    code: "",
                    options: ["F8", "F7", "Shift + F8", "Alt + F5"],
                    correct: 0
                },
                {
                    q: "Ushbu murakkab list slicing amali natijasi nima bo'ladi?",
                    code: "data = [10, 20, 30, 40, 50, 60]\nprint(data[-2::-2])",
                    options: ["[50, 30, 10]", "[60, 40, 20]", "[50, 40, 30]", "[40, 20]"],
                    correct: 0
                },
                {
                    q: "PyCharm'da 'Evaluate Expression' oynasini Debug vaqtida chaqirish tugmasi qaysi?",
                    code: "",
                    options: ["Alt + F8", "Ctrl + F8", "Shift + F9", "Alt + Enter"],
                    correct: 0
                }
            ]
        };

        let currentLevel = 1;
        let streak = 0;
        let currentQuestion = null;

        function getLevelName(lvl) {
            if (lvl === 1) return "1 (Boshlang'ich)";
            if (lvl === 2) return "2 (O'rta)";
            return "3 (Qiyin / Ekspert)";
        }

        function loadQuestion() {
            const nextBtn = document.getElementById('nextBtn');
            const statusMsg = document.getElementById('statusMsg');
            nextBtn.style.display = 'none';
            statusMsg.style.display = 'none';

            // Hozirgi darajadan tasodifiy savol olish
            const pool = questionsByLevel[currentLevel];
            const randomIndex = Math.floor(Math.random() * pool.length);
            currentQuestion = pool[randomIndex];

            document.getElementById('levelBadge').textContent = `Daraja: ${getLevelName(currentLevel)}`;
            document.getElementById('streakBoard').textContent = `Ketma-ket to'g'ri: ${streak}`;
            document.getElementById('questionText').textContent = currentQuestion.q;

            const codeBlock = document.getElementById('codeBlock');
            if (currentQuestion.code) {
                codeBlock.textContent = currentQuestion.code;
                codeBlock.style.display = 'block';
            } else {
                codeBlock.style.display = 'none';
            }

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            currentQuestion.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(idx, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIdx, selectedBtn) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);

            const statusMsg = document.getElementById('statusMsg');
            statusMsg.style.display = 'block';

            if (selectedIdx === currentQuestion.correct) {
                selectedBtn.classList.add('correct');
                streak++;
                
                // Har 2 ta to'g'ri javobdan so'ng daraja oshadi (Max: Level 3)
                if (streak % 2 === 0 && currentLevel < 3) {
                    currentLevel++;
                    statusMsg.textContent = "🔥 Barakalla! Darajangiz oshdi!";
                } else {
                    statusMsg.textContent = "✅ To'g me'yorda ketyapsiz!";
                }
                statusMsg.className = "status-msg success";
            } else {
                selectedBtn.classList.add('wrong');
                buttons[currentQuestion.correct].classList.add('correct');
                
                // Xato qilinganda daraja qaytadan 1-darajaga tushadi va streak nollanadi
                currentLevel = 1;
                streak = 0;
                
                statusMsg.textContent = "❌ Noto'g'ri! Daraja va ballingiz nollashdi. Qaytadan 1-darajadan boshlaysiz.";
                statusMsg.className = "status-msg fail";
            }

            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextQuestion() {
            loadQuestion();
        }

        // Dastlabki yuklash
        loadQuestion();
    </script>
</body>
</html>
